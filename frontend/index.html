<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Pullcord te avisa cuando una dirección de Stellar recibe un pago. Solo avisa, nunca mueve fondos. Solo testnet." />
    <meta name="theme-color" content="#0B0D12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Pullcord: te avisa cuando llega un pago</title>
    <script>
      try {
        var t = localStorage.getItem("pullcord-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
